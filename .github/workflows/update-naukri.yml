name: Update Naukri Profile

on:
  schedule:
    - cron: '30 18 * * *' # Runs daily at midnight IST (18:30 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-profile:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Naukri profile
        uses: ./
        with:
          username: ${{ secrets.NAUKRI_USERNAME }}
          password: ${{ secrets.NAUKRI_PASSWORD }}
          profile_id: ${{ secrets.NAUKRI_PROFILE_ID }}
          resume_path: |-
            ./resumes/Mohammad_Irfanuddin_FullStack_Developer_v3.pdf
          profile_summary: 'Experienced professional actively seeking new opportunities. Skilled in delivering high-quality work with a strong focus on results and continuous improvement.'
