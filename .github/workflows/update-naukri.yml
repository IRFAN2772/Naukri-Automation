name: Update Naukri Profile

on:
  schedule:
    - cron: '30 18 * * *' # Runs daily at midnight IST (18:30 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup VPN (India)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn > /dev/null 2>&1
          
          echo "📡 Fetching VPN servers from VPNGate..."
          
          # Fetch VPNGate server list
          RAW_DATA=$(curl -s "http://www.vpngate.net/api/iphone/")
          
          # Debug: show how many lines we got
          LINE_COUNT=$(echo "$RAW_DATA" | wc -l)
          echo "📊 Got $LINE_COUNT lines from VPNGate API"
          
          # Remove header lines and footer
          VPNGATE_CSV=$(echo "$RAW_DATA" | tail -n +3 | head -n -1)
          
          # Debug: show available countries
          echo "🌍 Available countries:"
          echo "$VPNGATE_CSV" | awk -F',' '{print $7}' | sort | uniq -c | sort -rn | head -15
          
          # Try India first, then nearby Asian countries
          SERVERS=""
          for COUNTRY_CODE in IN SG BD LK PK MY TH JP KR; do
            SERVERS=$(echo "$VPNGATE_CSV" | awk -F',' -v cc="$COUNTRY_CODE" '$7 == cc && $15 != ""' | head -3)
            if [ -n "$SERVERS" ]; then
              echo "✅ Found servers in $COUNTRY_CODE"
              break
            fi
            echo "❌ No servers in $COUNTRY_CODE"
          done
          
          if [ -z "$SERVERS" ]; then
            echo "⚠️ No preferred country found, trying ANY available server..."
            SERVERS=$(echo "$VPNGATE_CSV" | awk -F',' '$15 != ""' | sort -t',' -k3 -rn | head -5)
          fi
          
          CONNECTED=false
          
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            
            # Extract fields
            OVPN_BASE64=$(echo "$line" | cut -d',' -f15)
            SERVER_IP=$(echo "$line" | cut -d',' -f2)
            COUNTRY=$(echo "$line" | cut -d',' -f7)
            
            [ -z "$OVPN_BASE64" ] && continue
            
            echo "🔄 Trying server $SERVER_IP ($COUNTRY)..."
            
            # Decode and save OpenVPN config
            echo "$OVPN_BASE64" | base64 -d > /tmp/vpn.ovpn
            
            # Start OpenVPN in background
            sudo openvpn --config /tmp/vpn.ovpn --daemon --log /tmp/vpn.log \
              --connect-retry 3 --connect-timeout 10 \
              --auth-nocache --script-security 2
            
            # Wait for connection (max 30 seconds)
            for i in $(seq 1 30); do
              if ip addr show tun0 > /dev/null 2>&1; then
                echo "✅ VPN connected via $COUNTRY ($SERVER_IP)"
                CONNECTED=true
                break
              fi
              sleep 1
            done
            
            if [ "$CONNECTED" = true ]; then
              break
            else
              echo "❌ Connection failed, VPN log:"
              sudo cat /tmp/vpn.log 2>/dev/null | tail -5
              sudo killall openvpn 2>/dev/null || true
              sleep 2
            fi
          done <<< "$SERVERS"
          
          if [ "$CONNECTED" = false ]; then
            echo "❌ Could not connect to any VPN server"
            exit 1
          fi
          
          # Verify IP
          MY_IP=$(curl -s https://ipinfo.io/json)
          echo "🌐 Current IP info: $MY_IP"

      - name: Update Naukri profile
        uses: ./
        with:
          username: ${{ secrets.NAUKRI_USERNAME }}
          password: ${{ secrets.NAUKRI_PASSWORD }}
          profile_id: ${{ secrets.NAUKRI_PROFILE_ID }}
          resume_path: |-
            ./resumes/Mohammad_Irfanuddin_FullStack_Developer_v3.pdf
          profile_summary: 'Full Stack Engineer with 2+ years of experience designing and building enterprise-grade applications, secure authentication systems, and scalable microservices platforms. I enjoy taking ownership of software from architecture to production, breaking complex problems into maintainable services, designing reliable integrations, implementing security-first solutions, and delivering polished user experiences. At Skillsoft, I have contributed to building enterprise learning platforms by developing microservices, RBAC authorization systems, impersonation workflows, Microsoft Entra ID integrations, Graph API-based provisioning services, and resilient third-party integrations. CORE EXPERTISE - React and Modern Frontend Development - Node.js and Backend Services - Microservices Architecture - Authentication and Authorization (JWT, RBAC, Entra ID) - REST APIs and Third-Party Integrations - PostgreSQL and Database - Azure Cloud Services - Testing and Quality Engineering - System Design and Distributed Systems'
          resume_headline: 'Full Stack Developer (Node.js, React.js & Microservices) | 2+ Years Experience | Skills: REST APIs, Azure AD, JWT, RBAC, Sequelize | Architected Impersonation & RBAC | 30 Days Notice'
